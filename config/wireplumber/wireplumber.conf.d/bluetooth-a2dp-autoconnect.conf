## Auto-connect audio profiles on Bluetooth devices.
## This helps headsets, speakers and receivers expose their audio profiles
## without requiring manual PipeWire/WirePlumber recovery.
##
## hfp_hf is listed so headset microphones come up automatically too; without
## it only playback connects and the mic never appears. Order matters --
## a2dp_sink first so music lands on the high-quality profile by default.
## Pairs with MultiProfile = multiple in /etc/bluetooth/main.conf, which lets
## A2DP and HFP stay connected simultaneously instead of displacing each other.

monitor.bluez.properties = {
  ## Native backend so mSBC / LC3 wideband speech is available instead of
  ## being limited to 8 kHz narrowband CVSD.
  bluez5.enable-msbc = true
  bluez5.enable-sbc-xq = true
  bluez5.enable-hw-volume = true
  bluez5.roles = [ a2dp_sink a2dp_source hfp_hf hfp_ag ]
}

monitor.bluez.rules = [
  {
    matches = [
      {
        device.name = "~bluez_card.*"
      }
    ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ a2dp_sink a2dp_source hfp_hf ]
      }
    }
  }
]
