[font]
base-size = 11

# Menus (SUPER+SPACE, SUPER+ALT+SPACE, SUPER+ESCAPE) dressed as the Dynamic
# Island: opaque black, no outline, rows lifted like island cards. They drop
# out of the top edge via the omarchy-menu layer rule in hypr/looknfeel.lua.
[menu]
background                = "#000000"
background-alpha          = 1.0
border                    = "#000000"
border-alpha              = 0.0
scrim                     = "#000000"
scrim-alpha               = 0.0
selected-background       = "#FFFFFF"
selected-background-alpha = 0.12
selected-border-alpha     = 0.0
